  # =====================
  # Stripe決済関連API
  # =====================
  /api/stripe/subscription/create:
    post:
      tags:
        - Stripe決済
      summary: サブスクリプション作成
      description: |
        有料プラン選択時、Stripe CustomerとSubscriptionを作成しClientSecretを返す
        フロントのStep3→Step4移行時に呼ばれる
        responseStatusは成功時に1を返却、失敗時は0を返却
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
            format: user_id
          description: ユーザーID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
      responses:
        '200':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSubscriptionResponse'
        '409':
          description: 既にアクティブなサブスクリプションが存在
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer
                  message:
                    type: string
        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/stripe/subscription/:
    get:
      tags:
        - Stripe決済
      summary: 現在のサブスクリプション情報取得
      description: |
        ユーザーの現在のサブスクリプション状態を取得する
        サブスクリプションがない場合はnullを返す
        responseStatusは成功時に1を返却、失敗時は0を返却
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
          description: ユーザーID
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer
                  subscription:
                    $ref: '#/components/schemas/SubscriptionSchema'
        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/stripe/subscription/cancel:
    post:
      tags:
        - Stripe決済
      summary: サブスクリプション解約
      description: |
        サブスクリプションを期間終了時に解約する
        即時解約ではなく、現在の請求期間終了まで利用可能
        responseStatusは成功時に1を返却、失敗時は0を返却
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
          description: ユーザーID
      responses:
        '200':
          description: 解約予約成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer
                  subscription:
                    $ref: '#/components/schemas/SubscriptionSchema'
                  message:
                    type: string
        '404':
          description: アクティブなサブスクリプションが見つからない
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer
                  message:
                    type: string
        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/stripe/subscription/cancel/incomplete:
    post:
      tags:
        - Stripe決済
      summary: サブスクリプション解約（未完了）
      description: |
        未完了のサブスクリプションを解約する
        responseStatusは成功時に1を返却、失敗時は0を返却
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
          description: ユーザーID
      responses:
        '200':
          description: 解約成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer
                  message:
                    type: string
        '404':
          description: 未完了のサブスクリプションが見つからない
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer
                  message:
                    type: string
        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/webhooks/stripe:
    post:
      tags:
        - Stripe決済
      summary: StripeWebhook受信
      description: |
        Stripeからの非同期通知を受け取る
        Stripeダッシュボード「開発者」→「Webhook」でこのURLを登録すること
        対応イベント:
          - invoice.paid（支払い完了 → サブスク有効化/更新）
          - invoice.payment_failed（支払い失敗）
          - customer.subscription.deleted（サブスクリプション終了 → 無効化）
        【重要】リクエストボディは署名検証のためraw bodyで受け取ること
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
          description: Stripeの署名（署名検証に使用）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              description: Stripeからのイベントペイロード（raw bodyで受け取ること）
      responses:
        '200':
          description: 受信成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
        '400':
          description: 署名検証失敗
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string                                     

