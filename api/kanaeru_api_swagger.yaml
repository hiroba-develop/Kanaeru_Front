openapi: 3.0.3
info:
  title: Kanaeru API
  description: Kanaeru アプリケーションのAPI設計書
  version: 1.0.0

tags:
  - name: 認証
    description: 認証関連API
  - name: 設定変更
    description: 設定変更関連API
  - name: 年次損益計算書更新
    description: 年次損益計算書更新API
  - name: 画面初期表示
    description: 画面初期表示関連API
  - name: サポート画面
    description: サポート画面関連API
  - name: マンダラチャート
    description: マンダラチャート関連API
  - name: メイン目標
    description: メイン目標関連API
  - name: 大目標
    description: 大目標関連API
  - name: 中目標
    description: 中目標関連API
  - name: 小目標
    description: 小目標関連API
  - name: お問い合わせ
    description: お問い合わせ関連API
  - name: Stripe決済
    description: Stripe決済関連API
  - name: DailyGoal
    description: 日々の目標関連API
  - name: Slack連携
    description: Slack連携関連API（SLACK_USER_MAPPINGS テーブル）

paths:
  # =====================
  # 認証関連API
  # =====================
  /api/auth/login:
    post:
      tags:
        - 認証
      summary: ログイン
      description: |
        ユーザーログイン時使用
        responseStatusは成功時に1を返却、失敗時は0を返却
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
        - name: passwordHash
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ログイン成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer
                    description: 成功時は1、失敗時は0
                  userId:
                    type: string
                  name:
                    type: string
                  email:
                    type: string
                  userImageUrl:
                    type: string
                  termsAgreedAt:
                    type: string
                    format: date-time
                  role:
                    type: string
                  token:
                    type: string
                    description: JWT認証トークン
                  lastLoginAt:
                    type: string
                    format: date-time
  
  /api/auth/logout:
    post:
      tags:
        - 認証
      summary: ログアウト
      description: ログアウト時使用、トークン無効化
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: 認証トークン（JWT）
      responses:
        '200':
          description: ログアウト成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer
                  message:
                    type: string

  /api/auth/termsAgree:
    post:
      tags:
        - 認証
      summary: 利用規約同意
      description: |
        ログイン直後の利用規約同意時使用、利用規約同意日時を更新
        responseStatusは成功時に1を返却、失敗時は0を返却
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                termsAgreedAt:
                  type: string
      responses:
        '200':
          description: 同意成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer

  /api/auth/registration/user:
    post:
      tags:
        - 認証
      summary: ユーザー登録(一般ユーザー)
      description: |
        ユーザー登録時使用(一般ユーザー)
        responseStatusは成功時に1を返却、失敗時は0を返却
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userSchema:
                  $ref: '#/components/schemas/UserSchema'
                settingSchema:
                  $ref: '#/components/schemas/SettingSchema'
      responses:
        '200':
          description: 登録成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer

  /api/auth/delete:
    delete:
      tags:
        - 認証
      summary: ユーザー削除
      description: |
        ユーザー削除時使用
        responseStatusは成功時に1を返却、失敗時は0を返却
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 削除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer

  /api/auth/updatePassword:
    put:
      tags:
        - 認証
      summary: パスワード更新
      description: |
        パスワード更新時使用
        responseStatusは成功時に1を返却、失敗時は0を返却
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPasswordHash:
                  type: string
                newPasswordHash:
                  type: string
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer
                  message:
                    type: string

  /api/auth/forgotPassword:
    post:
      tags:
        - 認証
      summary: パスワード再発行
      description: |
        パスワード再発行時使用
        responseStatusは成功時に1を返却、失敗時は0を返却
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
      responses:
        '200':
          description: 再発行成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer

  /api/auth/resetPassword:
    post:
      tags:
        - 認証
      summary: パスワード再設定
      description: |
        パスワード再設定時使用
        responseStatusは成功時に1を返却、失敗時は0を返却
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                newPasswordHash:
                  type: string
      responses:
        '200':
          description: 再設定成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer

  /api/auth/registration/admin:
    post:
      tags:
        - 認証
      summary: ユーザー登録(管理者・プラットフォームオーナー)
      description: |
        ユーザー登録時使用(管理者・プラットフォームオーナー)
        responseStatusは成功時に1を返却、失敗時は0を返却
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userSchema:
                  $ref: '#/components/schemas/UserSchema'
      responses:
        '200':
          description: 登録成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer

  /api/get/users:
    get:
      tags:
        - ユーザー取得
      summary: ユーザー取得
      description: |
        ユーザー取得時使用
        responseStatusは成功時に1を返却、失敗時は0を返却
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer
                  userListSchema:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserListSchema'
                  settingListSchema:
                    type: array
                    items:
                      $ref: '#/components/schemas/SettingSchema'

  /api/get/adminUsers:
    get:
      tags:
        - 管理者ユーザー管理
      summary: 管理者ユーザーまたはプラットフォームユーザー取得
      description: |
        管理者ユーザーまたはプラットフォームユーザー取得時使用
        responseStatusは成功時に1を返却、失敗時は0を返却
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer
                  adminUserListSchema:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserListSchema'

  /api/update/adminUsers:
    put:
      tags:
        - 管理者ユーザー管理
      summary: 管理者ユーザーまたはプラットフォームユーザー更新
      description: |
        ユーザー登録時使用(管理者・プラットフォームオーナー)
        responseStatusは成功時に1を返却、失敗時は0を返却
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userSchema:
                  $ref: '#/components/schemas/UserSchema'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer
                  userSchema:
                    $ref: '#/components/schemas/UserSchema'

  /api/delete/account:
    delete:
      tags:
        - アカウント削除
      summary: アカウント削除
      description: |
        アカウント削除時使用
        responseStatusは成功時に1を返却、失敗時は0を返却
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 削除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer
                  message:
                    type: string
  # =====================
  # 設定変更関連API
  # =====================
  /api/setting/update/user:
    put:
      tags:
        - 設定変更
      summary: 設定内容変更(一般ユーザー)
      description: |
        設定内容更新時使用(一般ユーザー)
        responseStatusは成功時に1を返却、失敗時は0を返却
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userSchema:
                  $ref: '#/components/schemas/UserSchema'
                settingSchema:
                  $ref: '#/components/schemas/SettingSchema'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer
                  userSchema:
                    $ref: '#/components/schemas/UserSchema'
                  settingSchema:
                    $ref: '#/components/schemas/SettingSchema'

  /api/setting/user:
    get:
      tags:
        - 設定変更
      summary: 設定内容取得(一般ユーザー)
      description: |
        設定内容更新時使用(一般ユーザー)
        responseStatusは成功時に1を返却、失敗時は0を返却
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer
                  userSchema:
                    $ref: '#/components/schemas/UserSchema'
                  settingSchema:
                    $ref: '#/components/schemas/SettingSchema'
                  subscriptionSchema:
                    $ref: '#/components/schemas/SubscriptionSchema'

  /api/setting/update/admin:
    put:
      tags:
        - 設定変更
      summary: 設定内容変更(管理者・プラットフォームオーナー)
      description: |
        設定内容更新時使用(管理者・プラットフォームオーナー)
        responseStatusは成功時に1を返却、失敗時は0を返却
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userSchema:
                  $ref: '#/components/schemas/UserSchema'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer
                  userSchema:
                    $ref: '#/components/schemas/UserSchema'

  /api/setting/admin:
    get:
      tags:
        - 設定変更
      summary: 設定内容取得(管理者・プラットフォームオーナー)
      description: |
        設定内容更新時使用(管理者・プラットフォームオーナー)
        responseStatusは成功時に1を返却、失敗時は0を返却
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer
                  userSchema:
                    $ref: '#/components/schemas/UserSchema'

  /api/setting/user/image:
    post:
      tags:
        - 設定変更
      summary: ユーザー画像登録
      description: |
        ユーザー画像登録時使用
        responseStatusは成功時に1を返却、失敗時は0を返却
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
                type: object
                required:
                  - userId
                  - imageFile
                properties:
                  userId:
                    type: string
                    description: ユーザーID（必須）
                  imageFile:
                    type: string
                    format: binary
                    description: 書影画像ファイル（jpg, png, gif, 最大5MB）
      responses:
        '200':
          description: 登録成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer
                  imageUrl:
                    type: string  

  # =====================
  # 年次PL更新関連API
  # =====================
  /api/sale/update:
    put:
      tags:
        - 年次損益計算書更新
      summary: 売上更新
      description: |
        売上更新時使用
        responseStatusは成功時に1を返却、失敗時は0を返却
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleSchema'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer
                  saleSchema:
                    $ref: '#/components/schemas/SaleSchema'

  /api/grossProfit/update:
    put:
      tags:
        - 年次損益計算書更新
      summary: 粗利益更新
      description: |
        粗利益更新時使用
        responseStatusは成功時に1を返却、失敗時は0を返却
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrossProfitSchema'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer
                  grossProfitSchema:
                    $ref: '#/components/schemas/GrossProfitSchema'

  /api/operatingProfit/update:
    put:
      tags:
        - 年次損益計算書更新
      summary: 営業利益更新
      description: |
        営業利益更新時使用
        responseStatusは成功時に1を返却、失敗時は0を返却
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatingProfitSchema'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer
                  operatingProfitSchema:
                    $ref: '#/components/schemas/OperatingProfitSchema'

  /api/netAsset/update:
    put:
      tags:
        - 年次損益計算書更新
      summary: 純資産更新
      description: |
        純資産更新時使用
        responseStatusは成功時に1を返却、失敗時は0を返却
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetAssetsSchema'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer
                  netAssetsSchema:
                    $ref: '#/components/schemas/NetAssetsSchema'

  # =====================
  # 画面初期表示関連API
  # =====================
  /api/home:
    get:
      tags:
        - 画面初期表示
      summary: ホーム画面 初期表示
      description: |
        ホーム画面初期表示時使用
        responseStatusは成功時に1を返却、失敗時は0を返却
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer
                  mainGoalSchema:
                    $ref: '#/components/schemas/MainGoalSchema'
                  largeGoalSchema:
                    type: array
                    items:
                      $ref: '#/components/schemas/LargeGoalSchema'
                  saleSchema:
                    $ref: '#/components/schemas/SaleSchema'
                  grossProfitSchema:
                    $ref: '#/components/schemas/GrossProfitSchema'
                  operatingProfitSchema:
                    $ref: '#/components/schemas/OperatingProfitSchema'

  /api/yearlyBudgetActual:
    get:
      tags:
        - 画面初期表示
      summary: 予実管理(年次)画面 初期表示
      description: |
        予実管理(年次)画面初期表示時使用
        saleSchema, grossProfitSchema, operatingProfitSchemaは12ヶ月分のデータをセットする
        responseStatusは成功時に1を返却、失敗時は0を返却
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer
                  saleSchema:
                    type: array
                    items:
                      $ref: '#/components/schemas/SaleSchema'
                  grossProfitSchema:
                    type: array
                    items:
                      $ref: '#/components/schemas/GrossProfitSchema'
                  operatingProfitSchema:
                    type: array
                    items:
                      $ref: '#/components/schemas/OperatingProfitSchema'
                  largePLLinkedItemSchema:
                    type: array
                    items:
                      $ref: '#/components/schemas/LargePLLinkedItemSchema'
                  middlePLLinkedItemSchema:
                    type: array
                    items:
                      $ref: '#/components/schemas/MiddlePLLinkedItemSchema'

  /api/monthlyBudgetActual:
    get:
      tags:
        - 画面初期表示
      summary: 予実管理(月次)画面 初期表示
      description: |
        予実管理(月次)画面初期表示時使用
        responseStatusは成功時に1を返却、失敗時は0を返却
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: startMonth
          in: query
          required: true
          schema:
            type: string
            format: integer
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer
                  saleSchema:
                    type: array
                    items:
                      $ref: '#/components/schemas/SaleSchema'
                  grossProfitSchema:
                    type: array
                    items:
                      $ref: '#/components/schemas/GrossProfitSchema'
                  operatingProfitSchema:
                    type: array
                    items:
                      $ref: '#/components/schemas/OperatingProfitSchema'
                  largePLLinkedItemSchema:
                    type: array
                    items:
                      $ref: '#/components/schemas/LargePLLinkedItemSchema'
                  middlePLLinkedItemSchema:
                    type: array
                    items:
                      $ref: '#/components/schemas/MiddlePLLinkedItemSchema'

  /api/support:
    get:
      tags:
        - 画面初期表示
      summary: サポート画面 初期表示
      parameters:
        - name: selecteId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer
                  lastMessageSeq:
                    type: integer
                  dmMessageSchema:
                    $ref: '#/components/schemas/DmMessagesSchema'
                  dmMessagesSchemaList:
                    type: array
                    items:
                      $ref: '#/components/schemas/DmMessagesSchema'
                  adviceSchema:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdviceSchema'

  # =====================
  # サポート画面関連API
  # =====================
  /api/support/send:
    post:
      tags:
        - サポート画面
      summary: サポート画面 メッセージ送信
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                senderId:
                  type: string
                recipientId:
                  type: string
                content:
                  type: string
                messageSeq:
                  type: integer
      responses:
        '200':
          description: 送信成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSupportSendPost200Response'

  /api/support/read:
    get:
      tags:
        - サポート画面
      summary: サポート画面 メッセージ既読
      parameters:
        - name: senderId
          in: query
          required: true
          schema:
            type: string
        - name: recipientId
          in: query
          required: true
          schema:
            type: string
        - name: content
          in: query
          required: true
          schema:
            type: string
        - name: messageSeq
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 既読成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseStatus:
                    type: integer
                  lastMessageSeq:
                    type: integer
                  dmMessageSchema:
                    $ref: '#/components/schemas/DmMessagesSchema'

  /api/support/stream:
    get:
      tags:
        - サポート画面
      summary: サポート画面 メッセージ受信
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 受信成功
          content:
            application/json:
              schema:
                type: object
                properties:
