version: "3.8"

services:
  frontend:
    image: Kanaeru_front
    ports:
      - "5180:5180"
    volumes:
      - .:/app:cached
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=100
      - CHOKIDAR_BINARY_INTERVAL=300
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    restart: always
